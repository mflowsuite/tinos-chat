<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heladería Tino's</title>
  <style>
    /* margin: 0 en body es requerido para que el widget ocupe todo el viewport */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #ffffff; }
    n8nchatui-inpage { display: block; width: 100%; height: 100vh; }
  </style>
</head>
<body>
  <n8nchatui-inpage></n8nchatui-inpage>

  <script type="module" defer>
    import Chatbot from "https://cdn.n8nchatui.com/v1/pole-embed-yard.js";
    Chatbot.initFull({

      // ============================================================
      // ZONA EDITABLE — podés modificar todo lo que está entre aquí
      // ============================================================

      // URL del webhook de N8N (no cambiar salvo que cambie el servidor)
      "n8nChatUrl": "https://fluky-n8n.lembgk.easypanel.host/webhook/tinos",
      "metadata": {},
      "theme": {
        "button": {
          "iconColor": "#373434",
          "backgroundColor": "#ffffff"
        },
        "direction": "ltr",
        "consentScreen": {
          "enabled": false,
          "title": "User Agreement",
          "message": "By using this chatbot, you agree to our
<p><a href='/terms' target='_blank' style='color: black; text-decoration: underline; text-decoration-color: black;'>Terms & Conditions</a></p>",
          "textColor": "#1e1e1f",
          "acceptButtonColor": "#f36539",
          "acceptButtonTextColor": "#ffffff",
          "acceptButtonText": "Agree & Start Chatting",
          "backgroundColor": "#ffffff",
          "backdropColor": "#00000"
        },
        "chatWindow": {
          "borderRadiusStyle": "rounded",
          "avatarBorderRadius": 25,
          "messageBorderRadius": 6,

          // Título y logo del encabezado del chat
          "showTitle": true,
          "title": "Heladería Tino's",
          "titleAvatarSrc": "https://ugc.production.linktr.ee/6af99777-bc36-4a0c-957a-1ddefeaede37_WhatsApp-Image-2026-03-16-at-14.56.13.jpeg?io=true&size=avatar-v3_0",
          "avatarSize": 40,

          // Mensaje de bienvenida (primera vez que se abre el chat)
          "welcomeMessage": "¡Hola! Soy Cami, la asistente virtual de Heladería Tino's. ¿En qué puedo ayudarte hoy?",
          "errorMessage": "ups",
          "backgroundColor": "#ffffff",
          "fontSize": 16,

          // Botones de acceso rápido (starter prompts)
          "starterPrompts": [
            "🍦 ¿Qué sabores tenéis?",
            "💰 ¿Cuánto cuesta?",
            "🌿 ¿Tenéis opciones sin lactosa o sin gluten?",
            "🕐 ¿Cuál es vuestro horario?",
            "📋 Ver la carta completa"
          ],
          "starterPromptFontSize": 15,
          "renderHTML": false,
          "clearChatOnReload": true,
          "showScrollbar": true,

          // Estilo de los mensajes del bot
          "botMessage": {
            "backgroundColor": "#efe6b9",
            "textColor": "#000000",
            "showAvatar": true,
            "avatarSrc": "https://www.svgrepo.com/show/501883/ice-cream.svg",
            "showCopyToClipboardIcon": true
          },

          // Estilo de los mensajes del usuario
          "userMessage": {
            "backgroundColor": "#fff6f3",
            "textColor": "#050505",
            "showAvatar": true,
            "avatarSrc": "https://www.svgrepo.com/show/532363/user-alt-1.svg"
          },

          // Caja de texto donde el usuario escribe
          "textInput": {
            "placeholder": "Escribe tu pregunta aquí...",
            "backgroundColor": "#ffffff",
            "textColor": "#1e1e1f",
            "sendButtonColor": "#e5c215",
            "maxChars": 5000,
            "maxCharsWarningMessage": "You exceeded the characters limit. Please input less than 5000 characters.",
            "autoFocus": true,
            "borderRadius": 6,
            "sendButtonBorderRadius": 50
          },

          // Pie del chat (powered by)
          "footer": {
            "isCustomTextEnabled": true,
            "customText": "<div style=\"text-align:center; margin-top:8px;\">  <small style=\"display:inline-flex; align-items:center; gap:6px; color:#555;\">    <span>Powered by</span>    <img src=\"https://dcdn-us.mitiendanube.com/stores/006/912/635/products/mflowsuite-1x1-otra-ec3d467fe5c5f2d79b17725707529550-1024-1024.jpg\"          alt=\"MFlowSuite\"          style=\"width:22px; height:22px; border-radius:50%; vertical-align:middle;\">    <strong>MFlowSuite</strong>  </small></div>"
          }
        }
      }

      // ============================================================
      // FIN ZONA EDITABLE
      // ============================================================

    });
  </script>
</body>
</html>
